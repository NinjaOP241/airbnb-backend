services:
  # -------------------------
  # Databases
  # -------------------------
  hotel-postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: hotel_user
      POSTGRES_PASSWORD: hotel_password
      POSTGRES_DB: hotel_db
    ports:
      - "5432:5432"
    volumes:
      - hotel_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel_user"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  hotel_postgres_data:
